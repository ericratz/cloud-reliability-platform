apiVersion: v1
kind: ConfigMap
metadata:
  name: crp-loki-dashboard
  namespace: default
  labels:
    grafana_dashboard: "1"

data:
  crp-loki-dashboard.json: |
    {
      "uid": "crp-logs",
      "title": "CRP Logs",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "type": "logs",
          "title": "Application Logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"default\", pod=~\"crp-.*\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 10 }
        },
        {
          "type": "timeseries",
          "title": "Log Volume (lines/sec)",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(rate({namespace=\"default\", pod=~\"crp-.*\"}[2m]))",
              "refId": "B"
            }
          ],
          "gridPos": { "x": 0, "y": 10, "w": 12, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Error Log Rate",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(rate({namespace=\"default\", pod=~\"crp-.*\"} |= \"error\" [2m]))",
              "refId": "C"
            }
          ],
          "gridPos": { "x": 12, "y": 10, "w": 12, "h": 8 }
        }
      ]
    }