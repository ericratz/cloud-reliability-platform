apiVersion: v1
kind: ConfigMap
metadata:
  name: crp-dashboard
  labels:
    grafana_dashboard: "1"

data:
  crp-dashboard.json: |
    {
      "uid": "crp-overview",
      "title": "CRP Observability",
      "schemaVersion": 38,
      "version": 3,
      "refresh": "30s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Availability %",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "1 - (sum(rate(crp_requests_total{status=~\"5..\"}[2m])) / clamp_min(sum(rate(crp_requests_total[2m])), 1))",
              "refId": "A"
            }
          ],
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Error Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(crp_requests_total{status=~\"5..\"}[2m])) / clamp_min(sum(rate(crp_requests_total[2m])), 1)",
              "refId": "B"
            }
          ],
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 }
        },
        {
          "type": "timeseries",
          "title": "Latency p95",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(crp_request_duration_seconds_bucket[2m])) by (le))",
              "refId": "C"
            }
          ],
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 }
        }
      ]
    }