apiVersion: apps/v1
kind: Deployment

metadata:
  name: crp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: crp

  template:
    metadata:
      labels:
        app: crp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"

    spec:
      serviceAccountName: crp-sa
      
      containers:
        - name: crp

          image: ericratz.azurecr.io/crp:latest

          ports:
            - containerPort: 8000

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"